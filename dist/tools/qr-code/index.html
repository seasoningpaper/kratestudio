<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code 產生器 Krate Studio</title><meta name="description" content="Krate Studio 是我的個人網站，分享程式、故事與生活小工具。"><link rel="icon" href="/images/krate-mark.svg"><link rel="stylesheet" href="/site.css"><link rel="stylesheet" href="/tools.css"><link rel="stylesheet" href="/qr.css"></head><body id="top"><a class="skip" href="#main">跳至主要內容</a><header class="site-header"><a href="/" class="brand" aria-label="Krate Studio 首頁">Krate Studio</a><button class="menu" aria-label="開啟選單" aria-expanded="false" aria-controls="site-nav"><span></span><span></span><span></span></button><nav id="site-nav" class="nav" aria-label="主要導覽"><a href="/">首頁</a><a href="/tools/" aria-current="page">工具</a><a href="/news/">消息</a><a href="/works/">作品</a><a href="/creators/">創作者</a><a href="/community/">社群</a><a href="/maker/">Koi Maker</a><a href="/tutorials/">教學</a><a href="/login/">登入與工作室</a></nav></header><main id="main" class="wrap page tools-page" data-tool="qr-code"><a class="tool-back" href="/tools/">返回工具箱</a><div class="tool-page-heading"><h1 class="page-title">QR Code 產生器</h1></div><div class="qr-workspace"><section class="tool-workbench" aria-label="QR Code 設定"><form class="tool-form"><label>內容類型<select name="type" aria-label="內容類型"><option value="url">網址</option><option value="text">文字</option><option value="wifi">Wi-Fi</option><option value="app">App 下載</option><option value="social">Facebook 與其他社群</option><option value="email">電子郵件</option><option value="tel">電話</option></select></label><div class="qr-fields" data-fields="url text app social"><label for="qr-content">網址</label><textarea id="qr-content" name="content" rows="3" maxlength="2900" placeholder="https://"></textarea><p class="qr-note" data-app-note hidden>填入 App Store、Google Play 或你自己的下載入口。掃描後前往該連結，不會自動判斷裝置。</p></div><div class="qr-fields" data-fields="wifi" hidden><label>網路名稱<input name="ssid" autocomplete="off" maxlength="128"></label><label>加密方式<select name="auth"><option value="WPA">WPA / WPA2 / WPA3 個人網路</option><option value="WEP">WEP</option><option value="nopass">開放網路</option></select></label><label>密碼<input name="password" type="password" autocomplete="off" maxlength="256"></label><label class="check-field"><input name="hidden" type="checkbox">隱藏網路</label></div><div class="qr-fields" data-fields="email" hidden><label>收件地址<input name="address" type="email" maxlength="254"></label><label>主旨<input name="subject" maxlength="200"></label><label>內文<textarea name="body" rows="3" maxlength="1500"></textarea></label></div><div class="qr-fields" data-fields="tel" hidden><label>電話號碼<input name="phone" type="tel" maxlength="30" placeholder="+886"></label></div><div class="tool-fields"><label>樣式<select name="style"><option value="square">正方形</option><option value="dots">點型</option><option value="rounded">圓角</option><option value="texture">材質</option></select></label><label>容錯<select name="level"><option value="L">L 約 7%</option><option value="M" selected>M 約 15%</option><option value="Q">Q 約 25%</option><option value="H">H 約 30%</option></select></label></div><label>圖片大小<select name="size"><option value="160">160 px</option><option value="240">240 px</option><option value="320" selected>320 px</option><option value="480">480 px</option><option value="640">640 px</option><option value="960">960 px</option><option value="1200">1200 px</option></select></label><div class="tool-actions"><button class="action" type="submit">產生 QR Code</button><button class="tool-secondary" type="reset">重設</button></div></form></section><section class="qr-preview-panel" aria-label="QR Code 預覽"><div class="qr-preview" data-qr-preview></div><div class="tool-result" role="status" aria-live="polite"></div><div class="tool-actions qr-downloads"><button class="tool-secondary" data-download="png" disabled>下載 PNG</button><button class="tool-secondary" data-download="svg" disabled>下載 SVG</button><button class="tool-secondary" data-download="html" disabled>下載 HTML</button></div><div class="tool-actions"><button class="tool-secondary" data-embed disabled>取得 iframe</button></div><textarea data-embed-output aria-label="iframe 嵌入碼" readonly hidden></textarea><p class="qr-note">內容只在瀏覽器內產生，不會儲存。嵌入碼會把內容放在網址中，請勿用於私人資料。</p><p class="qr-note" data-wifi-note hidden>Wi-Fi 密碼會包含在圖案與下載檔案內，請只分享給可信任的人。Wi-Fi 不提供 iframe。</p></section></div></main><footer class="site-footer"><div class="footer-top"><a class="brand" href="/">Krate Studio</a><div class="footer-links"><a href="/about/">關於 Krate Studio</a><a href="/contact/">聯絡與回報</a><a href="/privacy/">資料與隱私</a><a href="/status/">功能開放狀態</a></div></div><p class="fine">Krate Studio 個人網站</p><small class="release-version">0.2.8</small><a class="back-top" href="#top" aria-label="回到頁首"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15l7-7 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></footer><script src="/site.js" defer></script><script type="module" src="/tools.js"></script><script type="module" src="/qr.js"></script></body></html>
