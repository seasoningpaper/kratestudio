<!doctype html><html lang="zh-TW"><meta charset="utf-8"><title>Bus audio QA</title><button id="run">測試音訊</button><pre id="result">尚未執行</pre><script type="module">
import{BusAudio}from'/bus-audio.mjs';import{cycleState}from'/bus-core.mjs';
const output=document.querySelector('#result');
function tone(data,hz,rate){let re=0,im=0;const start=Math.floor(rate*.7),n=rate;for(let i=0;i<n;i++){const w=.5-.5*Math.cos(2*Math.PI*i/(n-1)),a=data[start+i]*w,angle=2*Math.PI*hz*i/rate;re+=a*Math.cos(angle);im+=a*Math.sin(angle)}return Math.hypot(re,im)/n;}
async function render(name,state,condition='normal',volume=.3){const c=new OfflineAudioContext(1,48000*2,48000);const engine=new BusAudio();engine.worklet=!!c.audioWorklet;if(engine.worklet)await c.audioWorklet.addModule('/bus-noise-worklet.js');engine.context=c;engine.build(c);engine.ready=true;engine.setVolume(volume);engine.update(state,condition);const buffer=await c.startRendering(),d=buffer.getChannelData(0),tail=d.subarray(24000);let sum=0,peak=0;for(const a of tail){sum+=a*a;peak=Math.max(peak,Math.abs(a))}let strongest=0,best=0;for(let hz=35;hz<=90;hz+=.5){const amp=tone(d,hz,48000);if(amp>best){best=amp;strongest=hz}}return{name,rms:Math.sqrt(sum/tail.length),peak,strongest,at750:tone(d,750,48000),finite:[...tail].every(Number.isFinite)};}
document.querySelector('#run').onclick=async()=>{output.textContent='執行中';try{const idle={...cycleState(0),rpm:800},accel=cycleState(5),retarder={...idle,speed:40,retarder:true};const rows=[];rows.push(await render('idle',idle));rows.push(await render('accelerate',accel));rows.push(await render('good',idle,'good'));rows.push(await render('poor',idle,'poor'));rows.push(await render('retarder',retarder));rows.push(await render('mute',idle,'normal',0));output.textContent=JSON.stringify({pass:rows.every(x=>x.finite&&x.peak<1)&&rows[0].strongest===40&&rows[1].strongest===80&&rows[3].rms>rows[2].rms&&rows[4].at750>rows[0].at750*5&&rows[5].rms===0,rows},null,2);}catch(e){output.textContent='ERROR '+e.stack}};
</script></html>
