<!doctype html><html lang="zh-TW"><meta charset="utf-8"><title>SoftFlow r3 測試尺寸</title><style>body{margin:0;font:14px sans-serif;background:#ddd}header{height:44px;display:flex;gap:16px;align-items:center;padding:0 16px}iframe{display:block;border:0;width:1366px;height:768px}select{font:inherit}output{max-width:400px;height:35px;overflow:auto;font-size:9px}</style><header><label>測試尺寸 <select id="size"><option>1366×768</option><option>3840×2160</option><option>2560×1600</option><option>1920×1080</option><option>1600×900</option><option>1024×768</option><option>390×844</option><option>375×812</option></select></label><span>同源完整應用程式；不模擬實體觸控或 DPI。</span><button id="measure">量測</button><output id="results" role="status"></output></header><iframe src="/" title="Koi Maker 尺寸驗收"></iframe><script>document.querySelector('select').onchange=e=>{const [w,h]=e.target.value.split('×');const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=h+'px'};function measure(){const d=document.querySelector('iframe').contentDocument,w=d.defaultView;const box=s=>{const e=d.querySelector(s),r=e.getBoundingClientRect(),c=w.getComputedStyle(e);return{x:r.x,y:r.y,width:r.width,height:r.height,display:c.display,font:c.fontSize,overflow:e.scrollWidth-e.clientWidth}};const result={theme:d.documentElement.dataset.softflow,viewport:[w.innerWidth,w.innerHeight],overflow:d.documentElement.scrollWidth-w.innerWidth,header:box('.app-header'),modes:[...d.querySelectorAll('.modes button')].map(e=>({text:e.textContent,width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height})),save:box('#save'),preview:box('#playTop'),nav:box('#toolNav'),footer:box('body>footer')};document.querySelector('output').textContent=JSON.stringify(result)}document.querySelector('#measure').onclick=measure;</script></html>
